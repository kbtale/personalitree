[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = '''
/(
    \.venv
  | __pycache__
  | migrations
)/
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "personalitree.settings"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--showlocals",
    "--tb=short",
    "--cov=core",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "slow: tests that take more than a second",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "__pycache__", "**/migrations", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "RUF",
    "BLE001",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR1704",
    "PLR2004",
    "S314",
    "TRY400",
]

[tool.ruff.lint.isort]
known-first-party = ["core", "personalitree"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-django>=4.9.0",
    "ruff>=0.12.0",
]

[tool.coverage.run]
source = ["core"]
branch = true
omit = ["core/migrations/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
